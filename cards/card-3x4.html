<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>绞胎器物卡 3:4</title>
<link rel="stylesheet" href="./vessel-card.css">
<style>
  html, body { width: 1080px; height: 1440px; margin: 0; overflow: hidden; background: #553422; }
</style>
</head>
<body>
  <!-- 静态稿。站内第 9 关会换成这一轮预览裁出的器物，并现场生成二维码。 -->
  <div class="vc-card">
    <i class="edge-top"></i>
    <i class="edge-right"></i>
    <div class="face">
      <div class="brass"></div>
      <div class="inner">
        <div class="kicker">当阳峪 · 出窑</div>
        <div class="niche" aria-hidden="true">
          <i class="tray-outer-r"></i>
          <i class="tray-back"></i>
          <i class="tray-side-l"></i>
          <i class="tray-side-r"></i>
          <i class="tray-floor"></i>
          <i class="tray-lip"></i>
          <i class="glow"></i>
          <img class="vessel" src="../assets/jiaotai-jar.svg" alt="" style="width:333px;height:389px">
        </div>
        <div class="archive">DY-20261113-C4A81B2E</div>
        <div class="author">阿羽</div>
        <div class="wish">想把山风，留在一只瓶子里。</div>
        <div class="summary">本地高岭土 · 鸟羽纹 · 梅瓶 · 经典高温</div>
        <div class="kiln">当阳峪窑在河南修武。<br>绞胎瓷花纹表里如一，人称瓷中君子，源于唐、兴于宋。</div>
        <div class="seal-slot" data-reserved="nine-seals"></div>
        <div class="footer">
          <div class="colophon">
            <div class="name">当阳峪</div>
            <div class="sub">透花瓷 · 开窑见纹</div>
          </div>
          <div class="qr">
            <!-- 站内由 cards/qrcode-generator.js 按礼匣首页现画，不引用第三方图片 -->
            <div style="width:168px;height:168px;box-sizing:border-box;background:#f4efe6;border:1.5px solid #b08a4f"></div>
            <span>扫码打开礼匣</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
