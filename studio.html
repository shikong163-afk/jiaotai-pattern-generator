<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>绞胎纹路生成器 · 当阳峪</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="vessel-ui.css" />
</head>
<body>
  <div class="grain" aria-hidden="true"></div>

  <header class="top">
    <p class="brand">绞胎纹路生成器</p>
    <p class="tag">当阳峪 · 器型设计 + 纹样起草 → 匠人筛选 → 可传播 · <a href="./index.html" style="color:#3d5a48;font-weight:700;text-decoration:none;">入场</a> · <a href="./index.html" style="color:#3d5a48;font-weight:700;text-decoration:none;">定制之旅</a></p>
  </header>

  <main class="stage">
    <section class="preview-panel">
      <div class="view-toggle" role="group" aria-label="预览模式">
        <button type="button" class="chip active" data-view="vessel">瓷器器型</button>
        <button type="button" class="chip" data-view="flat">纯纹样</button>
        <button type="button" class="chip" data-view="section">截面证明</button>
      </div>
      <div class="canvas-wrap studio">
        <canvas id="pattern" width="720" height="720" aria-label="绞胎瓷器设计预览"></canvas>
        <div class="canvas-meta">
          <span id="seedLabel">种子 —</span>
          <span id="styleLabel">鸟羽纹 · 梅瓶</span>
        </div>
      </div>
      <div class="preview-actions">
        <button type="button" class="btn primary" id="btnGenerate">生成设计</button>
        <button type="button" class="btn" id="btnExport">导出 PNG</button>
        <button type="button" class="btn" id="btnSaveVariant">收入对照</button>
        <button type="button" class="btn" id="btnAiGen">AI 生图</button>
      </div>
      <div class="ai-panel" id="aiPanel" hidden>
        <img id="aiImage" alt="AI 生成样张" />
        <p class="ai-status" id="aiStatus"></p>
      </div>
    </section>

    <aside class="control-panel">
      <div class="card">
        <h2>器型选型</h2>
        <p class="card-note" id="vesselHint">从小口丰肩等入门稳形开始</p>
        <div id="vesselPicker" aria-label="绞胎瓷器型分类选型"></div>
        <label class="row">
          <span>腹径</span>
          <input type="range" id="belly" min="0" max="500" value="340" />
          <strong id="bellyVal">340</strong>
        </label>
        <label class="row">
          <span>口沿</span>
          <input type="range" id="rim" min="0" max="500" value="240" />
          <strong id="rimVal">240</strong>
        </label>
        <label class="row">
          <span>足高</span>
          <input type="range" id="foot" min="0" max="500" value="70" />
          <strong id="footVal">70</strong>
        </label>
        <label class="row">
          <span>釉光</span>
          <input type="range" id="sheen" min="0" max="500" value="275" />
          <strong id="sheenVal">275</strong>
        </label>
      </div>

      <div class="card">
        <h2>纹样类型</h2>
        <div class="chips" id="styleChips" role="group" aria-label="纹样类型">
          <button type="button" class="chip active" data-style="feather">鸟羽纹</button>
          <button type="button" class="chip" data-style="weave">编织纹</button>
          <button type="button" class="chip" data-style="marble">大理石绞</button>
          <button type="button" class="chip" data-style="ribbon">带状绞</button>
        </div>
      </div>

      <div class="card">
        <h2>泥色（2–4 色）</h2>
        <div class="colors" id="colorInputs">
          <label><span>泥色 1</span><input type="color" id="c1" value="#2a2a2a" /></label>
          <label><span>泥色 2</span><input type="color" id="c2" value="#e8dcc8" /></label>
          <label><span>泥色 3</span><input type="color" id="c3" value="#6b8f71" /></label>
          <label><span>泥色 4</span><input type="color" id="c4" value="#8b5a3c" /></label>
        </div>
        <label class="row">
          <span>启用色数</span>
          <input type="range" id="colorCount" min="2" max="4" value="2" />
          <strong id="colorCountVal">2</strong>
        </label>
      </div>

      <div class="card">
        <h2>绞制参数</h2>
        <label class="row">
          <span>绞扭强度</span>
          <input type="range" id="twist" min="0" max="100" value="55" />
          <strong id="twistVal">55</strong>
        </label>
        <label class="row">
          <span>纹路密度</span>
          <input type="range" id="density" min="20" max="100" value="48" />
          <strong id="densityVal">48</strong>
        </label>
        <label class="row">
          <span>细节锐度</span>
          <input type="range" id="sharpness" min="10" max="100" value="62" />
          <strong id="sharpVal">62</strong>
        </label>
        <label class="row">
          <span>随机种子</span>
          <input type="number" id="seed" value="20261111" />
          <button type="button" class="btn tiny" id="btnRandomSeed">随机</button>
        </label>
      </div>

      <div class="card verdict" id="verdictCard">
        <h2>匠人筛选卡</h2>
        <p class="verdict-badge" id="verdictBadge">待生成</p>
        <ul id="verdictList"></ul>
      </div>

      <div class="card">
        <h2>AI 提示词（仅供参考）</h2>
        <textarea id="promptOut" rows="7" readonly></textarea>
        <div class="preview-actions">
          <button type="button" class="btn" id="btnCopyPrompt">复制提示词</button>
          <button type="button" class="btn" id="btnRefreshPrompt">按当前参数重写</button>
        </div>
      </div>
    </aside>
  </main>

  <section class="variants">
    <div class="variants-head">
      <h2>对照台 · 生成稿 vs 筛选</h2>
      <p>把多版纹样收入这里，开会时给匠人勾选：能绞 / 需简化 / 仅 3D / 不可实现</p>
    </div>
    <div class="variants-grid" id="variantsGrid"></div>
  </section>

  <footer class="foot">
      <p>省赛新闻传播赛道演示工具 · 25 种传统瓶型 + 绞胎纹样起草 · 瓶型参考公开陶瓷研究资料 · 不替代手工绞胎与工坊授权</p>
  </footer>

  <script src="config.js"></script>
  <script src="ai-client.js"></script>
  <script src="vessels.js"></script>
  <script src="vessel-ui.js"></script>
  <script src="app.js"></script>
</body>
</html>
