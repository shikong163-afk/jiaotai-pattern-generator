<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>当阳峪绞胎 · 启程</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="intro.css" />
</head>
<body class="gate-boot">
  <div class="grain" aria-hidden="true"></div>
  <div class="veil" aria-hidden="true"></div>
  <canvas class="bg-vessels" id="bgVessels" aria-hidden="true"></canvas>

  <nav class="progress" aria-label="启程进度">
    <button type="button" class="dot active" data-go="1">
      <span class="dot-mark" aria-hidden="true"></span>
      <span class="dot-label">工坊礼匣</span>
    </button>
    <button type="button" class="dot" data-go="2" disabled>
      <span class="dot-mark" aria-hidden="true"></span>
      <span class="dot-label">定制启程</span>
    </button>
  </nav>

  <main id="gate" data-stage="1">
    <!-- 启程礼匣（原二级开盒，更名美化） -->
    <section class="stage stage-gift is-active" id="stage1" aria-label="工坊礼匣">
      <div class="stage-inner gift-enter">
        <p class="eyebrow" id="giftEyebrow">当阳峪 · 工坊礼匣</p>
        <h1 class="brand-title gift-brand">
          <span class="line">打开礼匣</span>
          <span class="line accent">迎出你的君子瓷</span>
        </h1>
        <p class="lede gift-lede">点按盒盖，纹在胎中的旅程便从这里展开。</p>

        <div class="gift-stage" id="giftStage">
          <div class="gift-scene" id="giftScene" aria-label="工坊礼匣">
            <div class="gift-plinth" aria-hidden="true"></div>
            <div class="gift-box" id="giftBox">
              <div class="gift-thickness" aria-hidden="true"></div>
              <div class="gift-face gift-base">
                <div class="gift-inner-glow" aria-hidden="true"></div>
                <div class="gift-vessel" aria-hidden="true">
                  <svg class="gift-vessel-svg" viewBox="0 0 120 160" aria-hidden="true">
                    <defs>
                      <clipPath id="giftJarClip">
                        <path d="M60 10 C67 10 69 15 68 21 C67 28 64 32 66 38 C74 42 96 54 98 82 C100 112 84 146 60 148 C36 146 20 112 22 82 C24 54 46 42 54 38 C56 32 53 28 52 21 C51 15 53 10 60 10 Z" />
                      </clipPath>
                    </defs>
                    <g clip-path="url(#giftJarClip)">
                      <rect width="120" height="160" fill="#f4efe6" />
                      <path fill="#5c3a28" d="M18 150 C8 118 28 96 24 70 C20 46 40 36 52 28 C58 40 34 58 30 84 C26 112 40 136 18 150 Z" />
                      <path fill="#efe4d4" d="M34 146 C22 112 46 88 40 62 C36 42 54 30 62 22 C70 40 52 56 56 82 C60 112 52 134 34 146 Z" />
                      <path fill="#6b4632" d="M70 24 C86 36 78 58 92 72 C108 88 112 118 96 146 C78 128 86 104 74 82 C64 62 58 40 70 24 Z" />
                      <path fill="#f7f1e6" d="M62 30 C78 44 70 66 84 80 C98 96 100 122 84 144 C70 124 78 102 66 84 C56 66 52 44 62 30 Z" />
                      <path fill="#5c3a28" d="M51 14 C55 22 65 22 69 14 C71 26 66 36 60 40 C54 36 49 26 51 14 Z" />
                      <path fill="#efe4d4" d="M54 16 C57 24 63 24 66 16 C67 26 63 32 60 34 C57 32 53 26 54 16 Z" />
                      <path fill="#3f2a1e" d="M48 48 C58 38 66 58 60 74 C54 92 40 100 36 118 C48 108 58 92 62 74 C66 58 58 46 48 48 Z" />
                      <path fill="#c9b496" d="M44 70 C52 60 64 78 58 96 C52 116 38 124 34 140 C46 126 56 108 58 90 C60 76 52 68 44 70 Z" />
                      <path fill="#8a5a40" d="M76 78 C88 68 98 88 92 108 C86 128 74 138 78 150 C90 132 96 112 90 94 C86 82 80 76 76 78 Z" />
                    </g>
                    <path d="M52 18 C56 13 64 13 68 18" fill="none" stroke="#f7f3eb" stroke-width="2.2" stroke-linecap="round" />
                  </svg>
                </div>
              </div>
              <button type="button" class="gift-face gift-lid" id="giftLid" aria-label="打开盒盖">
                <span>当阳峪</span>
                <i class="gift-corner c-tl" aria-hidden="true"></i>
                <i class="gift-corner c-tr" aria-hidden="true"></i>
                <i class="gift-corner c-bl" aria-hidden="true"></i>
                <i class="gift-corner c-br" aria-hidden="true"></i>
                <i class="gift-clasp" aria-hidden="true"></i>
              </button>
              <div class="gift-face gift-flap gift-front"></div>
              <div class="gift-face gift-flap gift-back"></div>
              <div class="gift-face gift-flap gift-left"></div>
              <div class="gift-face gift-flap gift-right"></div>
            </div>
          </div>
        </div>

        <p class="journey-cta-line" id="giftHint">开启后，即可踏上九关定制旅程</p>
      </div>
    </section>

    <!-- 启程页 -->
    <section class="stage stage-start" id="stage2" aria-label="定制启程" hidden>
      <div class="stage-inner enter from-gift" id="stage2Inner">
        <p class="eyebrow">定制旅程 · 九关工坊</p>
        <h2 class="brand-title compact">
          <span class="line">表里如一</span>
          <span class="line accent">一步一关</span>
        </h2>
        <p class="journey-hero-line">立即开始你的绞胎瓷定制之旅吧</p>
        <p class="lede short">选土、炼泥、编花、定型、荫干、施釉、焙烧，直到出窑——每关都可动手预演。</p>

        <ol class="journey-map" id="journeyMap" aria-label="九关地图">
          <li><span>01</span>选土</li>
          <li><span>02</span>炼泥</li>
          <li><span>03</span>编花</li>
          <li><span>04</span>器型</li>
          <li><span>05</span>成型</li>
          <li><span>06</span>荫干</li>
          <li><span>07</span>施釉</li>
          <li><span>08</span>焙烧</li>
          <li><span>09</span>出窑</li>
        </ol>

        <div class="cta-row start-cta">
          <a class="btn primary pulse" href="./steps/01-soil.html">立即开始你的绞胎瓷定制之旅吧</a>
          <a class="btn ghost" href="./studio.html">先进纹样工坊</a>
        </div>
        <button type="button" class="btn textish" id="backGift">再看开匣</button>
      </div>
    </section>
  </main>

  <script src="vessels.js"></script>
  <script src="vessel-ui.js"></script>
  <script src="intro.js"></script>
</body>
</html>
