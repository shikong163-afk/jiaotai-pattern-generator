<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>当阳峪绞胎 · 启程</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="intro.css" />
</head>
<body class="gate-boot">
  <div class="grain" aria-hidden="true"></div>
  <div class="veil" aria-hidden="true"></div>
  <canvas class="bg-vessels" id="bgVessels" aria-hidden="true"></canvas>

  <nav class="progress" aria-label="启程进度">
    <button type="button" class="dot active" data-go="1">
      <span class="dot-mark" aria-hidden="true"></span>
      <span class="dot-label">工坊礼匣</span>
    </button>
    <button type="button" class="dot" data-go="2" disabled>
      <span class="dot-mark" aria-hidden="true"></span>
      <span class="dot-label">定制启程</span>
    </button>
  </nav>

  <main id="gate" data-stage="1">
    <!-- 启程礼匣（原二级开盒，更名美化） -->
    <section class="stage stage-gift is-active" id="stage1" aria-label="工坊礼匣">
      <div class="stage-inner gift-enter">
        <p class="eyebrow" id="giftEyebrow">当阳峪 · 工坊礼匣</p>
        <h1 class="brand-title gift-brand">
          <span class="line">打开礼匣</span>
          <span class="line accent">迎出你的君子瓷</span>
        </h1>
        <p class="lede gift-lede">点按盒盖，纹在胎中的旅程便从这里展开。</p>

        <div class="gift-stage" id="giftStage">
          <div class="gift-scene" id="giftScene" aria-label="工坊礼匣">
            <div class="gift-shadow" aria-hidden="true"></div>
            <div class="gift-plinth" aria-hidden="true"><i class="pl-top"></i><i class="pl-front"></i></div>
            <div class="gift-box" id="giftBox">
              <div class="tray">
                <i class="tray-back" aria-hidden="true"></i>
                <i class="tray-floor" aria-hidden="true"></i>
                <i class="tray-side-l" aria-hidden="true"></i>
                <i class="tray-side-r" aria-hidden="true"></i>
                <i class="tray-lip" aria-hidden="true"></i>
                <div class="gift-inner-glow" aria-hidden="true"></div>
                <div class="gift-vessel" aria-hidden="true"></div>
              </div>
              <button type="button" class="sleeve" id="giftLid" aria-label="打开礼匣">
                <i class="sl-top" aria-hidden="true"></i>
                <i class="sl-right" aria-hidden="true"></i>
                <span class="sl-front"><b>当阳峪</b><i class="sl-clasp" aria-hidden="true"></i></span>
              </button>
            </div>
          </div>
        </div>

        <p class="gift-open-voice">纹在胎里，打开才看见。</p>
        <p class="journey-cta-line" id="giftHint">开启后，即可踏上九关定制旅程</p>
      </div>
    </section>

    <!-- 启程页 -->
    <section class="stage stage-start" id="stage2" aria-label="定制启程" hidden>
      <div class="stage-inner enter from-gift" id="stage2Inner">
        <p class="eyebrow">定制旅程 · 九关工坊</p>
        <h2 class="brand-title compact">
          <span class="line">表里如一</span>
          <span class="line accent">一步一关</span>
        </h2>
        <p class="journey-hero-line">立即开始你的绞胎瓷定制之旅吧</p>
        <p class="lede short">选土、炼泥、编花、定型、荫干、施釉、焙烧，直到出窑——每关都可动手预演。</p>

        <ol class="journey-map" id="journeyMap" aria-label="九关地图">
          <li><span>01</span>选土</li>
          <li><span>02</span>炼泥</li>
          <li><span>03</span>编花</li>
          <li><span>04</span>器型</li>
          <li><span>05</span>成型</li>
          <li><span>06</span>荫干</li>
          <li><span>07</span>施釉</li>
          <li><span>08</span>焙烧</li>
          <li><span>09</span>出窑</li>
        </ol>

        <div class="cta-row start-cta">
          <a class="btn primary pulse" href="./steps/01-soil.html">立即开始你的绞胎瓷定制之旅吧</a>
          <a class="btn ghost" href="./studio.html">先进纹样工坊</a>
        </div>
        <button type="button" class="btn textish" id="backGift">再看开匣</button>
      </div>
    </section>
  </main>

  <script src="vessels.js"></script>
  <script src="vessel-ui.js"></script>
  <script src="intro.js"></script>
</body>
</html>
